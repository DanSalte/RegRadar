<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="560" viewBox="0 0 1190 560" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- White background so the diagram stays readable in dark mode. -->
  <rect width="1190" height="560" fill="#ffffff"/>

  <!-- Core: outer hexagon = application, inner hexagon = domain -->
  <text x="480" y="122" font-size="16" font-weight="bold" fill="#1a3d8f">Core</text>
  <polygon points="660,290 570,134 390,134 300,290 390,446 570,446" fill="#e8f0fe" stroke="#3367d6" stroke-width="2"/>
  <text x="480" y="162" font-size="14" font-weight="bold" fill="#1a3d8f">core/application</text>
  <text x="480" y="182" font-size="13" fill="#202124">Use Case ingest()</text>
  <polygon points="570,290 525,212 435,212 390,290 435,368 525,368" fill="#c6dafc" stroke="#3367d6" stroke-width="1.5"/>
  <text x="480" y="276" font-size="13" font-weight="bold" fill="#1a3d8f">core/domain</text>
  <text x="480" y="298" font-size="12" fill="#202124">Entity Procedure</text>
  <text x="480" y="316" font-size="12" fill="#202124">Value Object Window</text>

  <!-- Ports on the border of the core -->
  <rect x="540" y="199" width="150" height="26" rx="13" fill="#ffffff" stroke="#3367d6" stroke-width="1.5"/>
  <text x="615" y="216" font-size="11.5" fill="#202124">Port: ProcedureSource</text>
  <rect x="585" y="277" width="150" height="26" rx="13" fill="#ffffff" stroke="#3367d6" stroke-width="1.5"/>
  <text x="660" y="294" font-size="11.5" fill="#202124">Port: RawStore</text>
  <rect x="540" y="355" width="150" height="26" rx="13" fill="#ffffff" stroke="#3367d6" stroke-width="1.5"/>
  <text x="615" y="372" font-size="11.5" fill="#202124">Port: DeadLetterStore</text>

  <!-- Driving adapter (left) -->
  <rect x="40" y="250" width="180" height="80" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="130" y="272" font-size="11" font-weight="bold" fill="#188038">Driving Adapter</text>
  <text x="130" y="292" font-size="11" font-family="Menlo, Consolas, monospace" fill="#202124">entrypoints/cli.py</text>
  <text x="130" y="310" font-size="11" font-family="Menlo, Consolas, monospace" fill="#202124">regradar ingest-dip</text>
  <text x="130" y="350" font-size="11" font-style="italic" fill="#5f6368">im selben Ordner: Composition Root</text>
  <line x1="220" y1="290" x2="298" y2="290" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="259" y="281" font-size="11" fill="#5f6368">ruft auf</text>

  <!-- Driven adapters (right) -->
  <rect x="780" y="118" width="180" height="64" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="870" y="136" font-size="11" font-weight="bold" fill="#b06000">Driven Adapter</text>
  <text x="870" y="154" font-size="13" font-weight="bold" fill="#202124">DipProcedureSource</text>
  <text x="870" y="171" font-size="11" font-family="Menlo, Consolas, monospace" fill="#202124">adapters/dip/</text>

  <rect x="780" y="258" width="180" height="64" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="870" y="276" font-size="11" font-weight="bold" fill="#b06000">Driven Adapter</text>
  <text x="870" y="294" font-size="13" font-weight="bold" fill="#202124">JsonlRawStore</text>
  <text x="870" y="311" font-size="11" font-family="Menlo, Consolas, monospace" fill="#202124">adapters/</text>

  <rect x="780" y="398" width="180" height="64" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="870" y="416" font-size="11" font-weight="bold" fill="#b06000">Driven Adapter</text>
  <text x="870" y="434" font-size="13" font-weight="bold" fill="#202124">JsonlDeadLetterStore</text>
  <text x="870" y="451" font-size="11" font-family="Menlo, Consolas, monospace" fill="#202124">adapters/</text>

  <line x1="690" y1="212" x2="778" y2="152" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="735" y1="290" x2="778" y2="290" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="368" x2="778" y2="428" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- External systems -->
  <rect x="1000" y="128" width="160" height="44" rx="22" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
  <text x="1080" y="155" font-size="13" fill="#202124">DIP-API</text>
  <rect x="1000" y="266" width="160" height="48" rx="10" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
  <text x="1080" y="286" font-size="11" font-family="Menlo, Consolas, monospace" fill="#202124">data/raw/</text>
  <text x="1080" y="302" font-size="11" font-family="Menlo, Consolas, monospace" fill="#202124">dip_procedure_*.jsonl</text>
  <rect x="1000" y="406" width="160" height="48" rx="10" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
  <text x="1080" y="426" font-size="11" font-family="Menlo, Consolas, monospace" fill="#202124">data/raw/</text>
  <text x="1080" y="442" font-size="11" font-family="Menlo, Consolas, monospace" fill="#202124">dead_letters.jsonl</text>

  <line x1="960" y1="150" x2="998" y2="150" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="960" y1="290" x2="998" y2="290" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="960" y1="430" x2="998" y2="430" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="40" y="505" font-size="12" fill="#5f6368" text-anchor="start">Sechseck = Core (Fachlogik, keine Technik): innen Domain, außen Application mit dem Use Case.</text>
  <text x="40" y="525" font-size="12" fill="#5f6368" text-anchor="start">Ports liegen auf dem Rand des Core. Driven Adapter erfüllen je einen Port; der Driving Adapter ruft den Core auf.</text>
</svg>
