line-length = 80
target-version = "py314"

[lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PT",
    "ANN", "S", "BLE", "TRY", "ERA", "C90", "PL", "PTH", "TID",
]
# Error handling rules (ADR-0007). Already part of the sets above; listed
# explicitly so that changing the sets cannot drop them silently.
extend-select = ["E722", "BLE001", "S110", "S112", "TRY400", "B012", "B904"]

[lint.mccabe]
max-complexity = 10

[lint.flake8-tidy-imports.banned-api]
"contextlib.suppress".msg = "Swallows exceptions silently (ADR-0007)."

[lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
